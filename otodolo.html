<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ötödölő — Bertalan Horváth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0f0f10;font-family:Poppins,sans-serif;color:#e8e8ea;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:26px 18px}
a{color:inherit;text-decoration:none}
.mono{font-family:'Space Mono',monospace}
.wrap{width:100%;max-width:920px}
.back{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:#a3a3aa;margin-bottom:18px}
.back:hover{color:#fff}
.card{border-radius:22px;background:linear-gradient(180deg,#242428,#1c1c1f);border:1px solid #2c2c31;overflow:hidden}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:26px 28px 18px}
.head h1{font-size:24px;font-weight:700;color:#fff;margin:0}
.head p{font-size:12.5px;color:#8c8c93;margin:6px 0 0}
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.turn{display:flex;align-items:center;gap:9px;border:1px solid #33333a;border-radius:999px;padding:8px 16px;font-size:12.5px;color:#c9c9ce}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;transition:background .15s}
.btng{font-size:12.5px;color:#a2a2a8;border:1px solid #33333a;border-radius:999px;padding:10px 18px;cursor:pointer;transition:all .15s;background:none;font-family:inherit}
.btng:hover{border-color:#8a8f98;color:#fff}
.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:0 28px 18px}
.seg-group{display:flex;align-items:center;gap:10px}
.seg-label{font-size:10px;letter-spacing:.14em;color:#6d6d74}
.seg{display:flex;border:1px solid #33333a;border-radius:999px;overflow:hidden}
.seg button{font-family:inherit;font-size:12px;color:#a2a2a8;background:none;border:none;border-right:1px solid #2c2c31;padding:8px 14px;cursor:pointer;transition:all .15s}
.seg button:last-child{border-right:none}
.seg button:hover{color:#fff}
.seg button.on{background:#2a2a3a;color:#fff}
#diffSeg{transition:opacity .15s}
#diffSeg button{min-width:34px;text-align:center;padding:8px 12px}
#diffSeg.hidden{display:none}
.stage{position:relative;margin:0 28px 28px;border-radius:16px;overflow:hidden;border:1px solid #2c2c31;background:#151517}
canvas{display:block;width:100%;height:560px;touch-action:none;cursor:crosshair}
.banner{position:absolute;left:50%;top:22px;transform:translateX(-50%) translateY(-14px);opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.16,1,.3,1);background:#1c1c21;border:1px solid #34343d;border-radius:999px;padding:11px 22px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 14px 34px rgba(0,0,0,.4);white-space:nowrap}
.banner.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:0 28px 28px;font-size:11px;color:#6d6d74;letter-spacing:.02em}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Vissza a portfólióra</a>
  <div class="card">
    <div class="head">
      <div>
        <h1>Ötödölő</h1>
        <p>Végtelen négyzetrács, öt egymás melletti jel nyer. Kattints a lerakáshoz, húzd az egeret / ujjad a mozgatáshoz.</p>
      </div>
      <div class="hud">
        <div class="turn"><span class="dot" id="turnDot"></span><span id="turnLabel">X következik</span></div>
        <button class="btng" id="resetBtn">Új játék</button>
      </div>
    </div>
    <div class="controls">
      <div class="seg-group">
        <span class="seg-label mono">MÓD</span>
        <div class="seg" id="modeSeg">
          <button data-mode="bot" class="on">Gép ellen</button>
          <button data-mode="pvp">2 játékos</button>
        </div>
      </div>
      <div class="seg-group">
        <span class="seg-label mono">NEHÉZSÉG</span>
        <div class="seg" id="diffSeg">
          <button data-lvl="1">1</button>
          <button data-lvl="2">2</button>
          <button data-lvl="3" class="on">3</button>
          <button data-lvl="4">4</button>
          <button data-lvl="5">5</button>
        </div>
      </div>
    </div>
    <div class="stage">
      <canvas id="board"></canvas>
      <div class="banner" id="banner"></div>
    </div>
    <div class="hint mono">
      <span>SCROLL = ZOOM</span>
      <span>DRAG = PAN</span>
      <span>CLICK = LERAKÁS</span>
    </div>
  </div>
</div>
<script>
(function(){
  var cv=document.getElementById('board'),ctx=cv.getContext('2d');
  var DPR=Math.min(window.devicePixelRatio||1,2);
  var W=0,H=0,cell=42,offX=0,offY=0;
  var PX={color:'#8f97ff',glow:'rgba(143,151,255,.5)'};
  var PO={color:'#7ed99a',glow:'rgba(126,217,154,.5)'};
  var stones=new Map(); // "x,y" -> 'X' | 'O'
  var turn='X',over=false,winCells=null;
  var mode='bot',difficulty=3,botTimer=null,humanSym='X',botSym='O';

  function key(x,y){return x+','+y}

  function fit(){
    var r=cv.getBoundingClientRect();
    W=Math.max(280,r.width);H=Math.max(280,r.height);
    cv.width=W*DPR;cv.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    draw();
  }
  new ResizeObserver(fit).observe(cv);

  // grid cell containing a screen point (cell-based, not intersection-based)
  function toGrid(px,py){
    return {x:Math.floor((px-offX)/cell),y:Math.floor((py-offY)/cell)};
  }
  function cellCenter(gx,gy){
    return {x:(gx+.5)*cell+offX,y:(gy+.5)*cell+offY};
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#151517';ctx.fillRect(0,0,W,H);

    var x0=Math.floor(-offX/cell)-1,x1=Math.ceil((W-offX)/cell)+1;
    var y0=Math.floor(-offY/cell)-1,y1=Math.ceil((H-offY)/cell)+1;

    ctx.strokeStyle='#232328';ctx.lineWidth=1;
    ctx.beginPath();
    for(var gx=x0;gx<=x1;gx++){var sx=Math.round(gx*cell+offX)+.5;ctx.moveTo(sx,0);ctx.lineTo(sx,H);}
    for(var gy=y0;gy<=y1;gy++){var sy=Math.round(gy*cell+offY)+.5;ctx.moveTo(0,sy);ctx.lineTo(W,sy);}
    ctx.stroke();

    var r=Math.max(6,cell*.32);
    stones.forEach(function(p,k){
      var parts=k.split(','),gxk=+parts[0],gyk=+parts[1];
      var c=cellCenter(gxk,gyk);
      if(c.x<-cell||c.x>W+cell||c.y<-cell||c.y>H+cell)return;
      var pl=p==='X'?PX:PO;
      var won=winCells&&winCells.indexOf(k)!==-1;
      if(won){
        ctx.beginPath();ctx.arc(c.x,c.y,r+7,0,6.2832);ctx.fillStyle=pl.glow;ctx.fill();
      }
      ctx.beginPath();ctx.arc(c.x,c.y,r,0,6.2832);
      ctx.fillStyle=won?'#fff':pl.color;
      ctx.fill();
      if(!won){ctx.lineWidth=1.5;ctx.strokeStyle=pl.glow;ctx.stroke();}
    });

    if(hover&&!over&&!(mode==='bot'&&turn===botSym)){
      var hk=key(hover.x,hover.y);
      if(!stones.has(hk)){
        var hc=cellCenter(hover.x,hover.y);
        ctx.beginPath();ctx.arc(hc.x,hc.y,r,0,6.2832);
        ctx.strokeStyle=(turn==='X'?PX.color:PO.color)+'88';ctx.lineWidth=1.6;ctx.stroke();
      }
    }
  }

  var DIRS=[[1,0],[0,1],[1,1],[1,-1]];
  function checkWin(x,y,p){
    for(var d=0;d<DIRS.length;d++){
      var dx=DIRS[d][0],dy=DIRS[d][1];
      var cells=[key(x,y)];
      var nx=x+dx,ny=y+dy;
      while(stones.get(key(nx,ny))===p){cells.push(key(nx,ny));nx+=dx;ny+=dy;}
      nx=x-dx;ny=y-dy;
      while(stones.get(key(nx,ny))===p){cells.push(key(nx,ny));nx-=dx;ny-=dy;}
      if(cells.length>=5)return cells;
    }
    return null;
  }

  // ---- bot AI: pattern-based heuristic with adjustable strength ----
  var SCORE={FIVE:1e8,OPEN4:1e6,FOUR:1e5,OPEN3:1e4,THREE:1e3,OPEN2:200,TWO:50,OPEN1:10,ONE:2};
  function patternScore(n,openEnds){
    if(n>=5)return SCORE.FIVE;
    if(n===4)return openEnds===2?SCORE.OPEN4:(openEnds===1?SCORE.FOUR:0);
    if(n===3)return openEnds===2?SCORE.OPEN3:(openEnds===1?SCORE.THREE:0);
    if(n===2)return openEnds===2?SCORE.OPEN2:(openEnds===1?SCORE.TWO:0);
    return openEnds===2?SCORE.OPEN1:(openEnds===1?SCORE.ONE:0);
  }
  function lineScore(x,y,p){
    var total=0;
    for(var d=0;d<DIRS.length;d++){
      var dx=DIRS[d][0],dy=DIRS[d][1],n=1;
      var nx=x+dx,ny=y+dy;
      while(stones.get(key(nx,ny))===p){n++;nx+=dx;ny+=dy;}
      var openA=!stones.has(key(nx,ny));
      nx=x-dx;ny=y-dy;
      while(stones.get(key(nx,ny))===p){n++;nx-=dx;ny-=dy;}
      var openB=!stones.has(key(nx,ny));
      total+=patternScore(n,(openA?1:0)+(openB?1:0));
    }
    return total;
  }
  function candidates(radius){
    var set=new Set();
    stones.forEach(function(_,k){
      var p=k.split(','),gx=+p[0],gy=+p[1];
      for(var dx=-radius;dx<=radius;dx++)for(var dy=-radius;dy<=radius;dy++){
        if(dx===0&&dy===0)continue;
        var nk=(gx+dx)+','+(gy+dy);
        if(!stones.has(nk))set.add(nk);
      }
    });
    if(!set.size)return[{x:0,y:0}];
    return Array.from(set).map(function(k){var p=k.split(',');return{x:+p[0],y:+p[1]}});
  }
  var DEFENSE_W=[0.55,0.7,0.85,1,1.15],NOISE=[6000,3000,1200,400,0],BLOCK_P=[0.5,0.85,1,1,1];
  function pickBotMove(level){
    var idx=Math.max(0,Math.min(4,level-1));
    var cs=candidates(2);
    var i,c;
    for(i=0;i<cs.length;i++){c=cs[i];if(lineScore(c.x,c.y,botSym)>=SCORE.FIVE)return c;}
    var blockCells=cs.filter(function(c){return lineScore(c.x,c.y,humanSym)>=SCORE.FIVE});
    if(blockCells.length){
      if(Math.random()<BLOCK_P[idx]){
        blockCells.sort(function(a,b){return lineScore(b.x,b.y,botSym)-lineScore(a.x,a.y,botSym)});
        return blockCells[0];
      }
      // chose not to block: actually remove these cells from consideration,
      // otherwise their huge defense score would win them the pick anyway
      var blockKeys=blockCells.map(function(c){return key(c.x,c.y)});
      cs=cs.filter(function(c){return blockKeys.indexOf(key(c.x,c.y))===-1});
    }
    var scored=cs.map(function(c){
      var atk=lineScore(c.x,c.y,botSym),def=lineScore(c.x,c.y,humanSym);
      var s=atk+def*DEFENSE_W[idx]+(Math.random()*2-1)*NOISE[idx];
      return{c:c,s:s};
    });
    scored.sort(function(a,b){return b.s-a.s});
    if(level>=4){
      var K=level===4?5:8,top=scored.slice(0,Math.min(K,scored.length));
      var best=null,bestAdj=-Infinity;
      top.forEach(function(t){
        var k2=key(t.c.x,t.c.y);
        stones.set(k2,botSym);
        var reply=candidates(2).reduce(function(m,cc){return Math.max(m,lineScore(cc.x,cc.y,humanSym))},0);
        stones.delete(k2);
        var adj=t.s-reply*0.9;
        if(adj>bestAdj){bestAdj=adj;best=t.c;}
      });
      return best;
    }
    return scored[0].c;
  }

  function setTurnUI(){
    var dot=document.getElementById('turnDot'),lbl=document.getElementById('turnLabel');
    dot.style.background=turn==='X'?PX.color:PO.color;
    if(over){return;}
    if(mode==='bot'&&turn===botSym)lbl.textContent='Gép gondolkodik…';
    else lbl.textContent=(turn===humanSym&&mode==='bot'?'Te következel':(turn==='X'?'X':'O')+' következik');
  }
  function showBanner(text){
    var b=document.getElementById('banner');
    b.textContent=text;b.classList.add('on');
  }
  function hideBanner(){document.getElementById('banner').classList.remove('on');}

  function place(x,y){
    if(over)return;
    var k=key(x,y);
    if(stones.has(k))return;
    var mover=turn;
    stones.set(k,mover);
    var win=checkWin(x,y,mover);
    if(win){
      over=true;winCells=win;
      var text;
      if(mode==='bot')text=mover===humanSym?'Nyertél! — öt egymás mellett':'A gép nyert — öt egymás mellett';
      else text=(mover==='X'?'X':'O')+' nyert! — öt egymás mellett';
      showBanner(text);
      draw();
      return;
    }
    turn=turn==='X'?'O':'X';
    setTurnUI();
    draw();
    if(mode==='bot'&&turn===botSym&&!over){
      botTimer=setTimeout(function(){
        var mv=pickBotMove(difficulty);
        botTimer=null;
        if(mv)place(mv.x,mv.y);
      },420);
    }
  }

  function reset(){
    if(botTimer){clearTimeout(botTimer);botTimer=null;}
    stones.clear();turn='X';over=false;winCells=null;
    offX=W/2;offY=H/2;
    setTurnUI();hideBanner();draw();
  }

  // pointer interaction: distinguish click (place) vs drag (pan)
  var dragging=false,downX=0,downY=0,startOffX=0,startOffY=0,moved=false,hover=null;
  cv.addEventListener('pointerdown',function(e){
    cv.setPointerCapture(e.pointerId);
    var r=cv.getBoundingClientRect();
    downX=e.clientX-r.left;downY=e.clientY-r.top;
    startOffX=offX;startOffY=offY;
    dragging=true;moved=false;
  });
  cv.addEventListener('pointermove',function(e){
    var r=cv.getBoundingClientRect();
    var px=e.clientX-r.left,py=e.clientY-r.top;
    if(dragging){
      var dx=px-downX,dy=py-downY;
      if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
      if(moved){offX=startOffX+dx;offY=startOffY+dy;}
    }
    hover=toGrid(px,py);
    draw();
  });
  cv.addEventListener('pointerup',function(e){
    if(dragging&&!moved){
      if(!(over||(mode==='bot'&&turn===botSym))){
        var r=cv.getBoundingClientRect();
        var g=toGrid(e.clientX-r.left,e.clientY-r.top);
        place(g.x,g.y);
      }
    }
    dragging=false;moved=false;
  });
  cv.addEventListener('pointerleave',function(){hover=null;draw();});
  cv.addEventListener('wheel',function(e){
    e.preventDefault();
    var r=cv.getBoundingClientRect();
    var mx=e.clientX-r.left,my=e.clientY-r.top;
    var wx=(mx-offX)/cell,wy=(my-offY)/cell;
    var factor=e.deltaY<0?1.1:1/1.1;
    cell=Math.max(18,Math.min(72,cell*factor));
    offX=mx-wx*cell;offY=my-wy*cell;
    draw();
  },{passive:false});

  document.getElementById('resetBtn').addEventListener('click',reset);

  document.getElementById('modeSeg').addEventListener('click',function(e){
    var btn=e.target.closest('button[data-mode]');
    if(!btn)return;
    mode=btn.dataset.mode;
    Array.from(this.children).forEach(function(b){b.classList.toggle('on',b===btn)});
    document.getElementById('diffSeg').classList.toggle('hidden',mode!=='bot');
    reset();
  });
  document.getElementById('diffSeg').addEventListener('click',function(e){
    var btn=e.target.closest('button[data-lvl]');
    if(!btn)return;
    difficulty=+btn.dataset.lvl;
    Array.from(this.children).forEach(function(b){b.classList.toggle('on',b===btn)});
  });

  fit();
  offX=W/2;offY=H/2;
  setTurnUI();
  draw();
})();
</script>
</body>
</html>
